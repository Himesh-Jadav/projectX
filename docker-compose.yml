services:
  smaran-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: smaran-ai:latest
    container_name: smaran-ai-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3003}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=production
      - AUTO_MIGRATE=true
      - APP_URL=${APP_URL_DOCKER:-http://localhost:${HOST_PORT:-3003}}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-3001}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
